spring.application.name=car-finder
spring.jpa.hibernate.ddl-auto=validate
carfinder.standvirtual.base-url=https://www.standvirtual.com
carfinder.standvirtual.max-pages=25
carfinder.standvirtual.delay-min-ms=4000
carfinder.standvirtual.delay-max-ms=9000
carfinder.standvirtual.user-agent=Mozilla/5.0 (X11; Linux x86_64; rv:131.0) Gecko/20100101 Firefox/131.0
carfinder.price.inflated-ratio=1.25
carfinder.price.well-below-ratio=0.80
server.address=127.0.0.1
server.port=8090
carfinder.needs-user-timeout=10m
carfinder.needs-user-retry=5s
spring.jpa.open-in-view=false
